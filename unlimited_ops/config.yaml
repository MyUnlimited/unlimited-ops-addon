# App fuer Home Assistant (Owner 2026-11-17). Schluessel nach der Referenz unter
# https://contributors.home-assistant.io/apps/reference/configuration/ (Stand 2026-10-22).
# version ist zugleich der Tag des Images; erst bauen (.github/workflows/image.yml), dann hier erhoehen.
# Name und Seitenleiste (Owner 2026-11-17): "Unlimited Betrieb", in der Seitenleiste kurz "Unlimited". slug bleibt
# unlimited_ops: Der Supervisor fuehrt die App und ihren Datenordner unter dem slug, ein neuer gaebe eine neue App.
name: Unlimited Betrieb
version: '0.3.33'
slug: unlimited_ops
description: Betriebswerkzeug für Unlimited
url: https://github.com/MyUnlimited/unlimited-ops
arch:
  - aarch64
  - amd64
image: ghcr.io/myunlimited/unlimited-ops
# Das Basis-Image bringt S6 Overlay als eigenes Init mit; mit Dockers Init startet es nicht.
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
# API aus dem Heimnetz (Owner 2026-11-21, docs/api.md): eigener Port neben Ingress. ops nimmt dort nur Anfragen aus
# 10.10.10.0/24 an (apps/addon/server/api-server.ts); der Port wird im Router nicht ins Internet freigegeben. Ohne
# host_network: Docker leitet den Port mit DNAT weiter, die Quelladresse bleibt erhalten.
ports:
  8100/tcp: 8100
ports_description:
  8100/tcp: API für ops aus dem Heimnetz (nur 10.10.10.0/24, mit Token)
panel_icon: mdi:server-network
panel_title: Unlimited
# Home Assistant (Owner 2026-11-19, docs/neubau.md Abschnitt 2): Sensoren und Knoepfe ueber MQTT-Discovery mit dem
# Mosquitto-Add-on (Zugang vom Supervisor, mqtt:want: ohne Broker startet ops trotzdem), Push ueber die API von Home
# Assistant an die Dienste aus notify_service (durch Komma getrennt, etwa mobile_app_pixel).
services:
  - mqtt:want
homeassistant_api: true
options:
  notify_service: ''
schema:
  notify_service: str?
# Sicherung im Lauf: vorher haelt ops das Schreiben des Zustands an, danach geht es weiter. Zwischenspeicher bleiben
# draussen (docs/neubau.md, Abschnitt 9).
backup: hot
backup_pre: /app/bin/backup-hook pre
backup_post: /app/bin/backup-hook post
backup_exclude:
  - cache/*
